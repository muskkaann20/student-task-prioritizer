spring.application.name=student-task-prioritizer

# Server — reads PORT env var set by Render; falls back to 8080 locally
server.port=${PORT:8080}

# SQLite locally — DataSourceConfig switches to PostgreSQL when DATABASE_URL is set
spring.datasource.url=jdbc:sqlite:student_tasks.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
# SQLite dialect — DataSourceConfig overrides this for PostgreSQL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Jackson — serialize LocalDate as "2024-12-31", not as a numeric array
spring.jackson.serialization.write-dates-as-timestamps=false

# Thymeleaf
spring.thymeleaf.cache=false

# Faculty-suggestion scoring weights (change here without touching code)
suggestion.weight.proficiency=3
suggestion.weight.free-hours=1
suggestion.weight.current-load=2
